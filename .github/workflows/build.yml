name: Build AVTEST64

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FASM
        run: |
          sudo apt-get update
          sudo apt-get install -y fasm

      - name: Assemble
        working-directory: main
        run: |
          set -e
          fasm avtest64.asm AVTEST64
          test -s AVTEST64

      - name: Upload AVTEST64
        uses: actions/upload-artifact@v4
        with:
          name: AVTEST64
          path: main/AVTEST64
          if-no-files-found: error
